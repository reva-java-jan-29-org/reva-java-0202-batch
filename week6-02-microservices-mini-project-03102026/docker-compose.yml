version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# E-Commerce Microservices — Docker Compose
#
# Startup order (enforced via depends_on + healthchecks):
#   mysql → config-server → eureka-server
#        → user-service, product-service
#        → order-service, payment-service
#        → api-gateway
#
# All services communicate via the internal "ecommerce-net" network.
# Only the API Gateway port (8080) is published to the host machine.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root123
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Config Server ──────────────────────────────────────────────────────────
  config-server:
    image: ecommerce/config-server:latest
    container_name: config-server
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:///config-repo
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - ./ecommerce-config-repo:/config-repo
    ports:
      - "8888:8888"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  # ── Eureka Server ──────────────────────────────────────────────────────────
  eureka-server:
    image: ecommerce/eureka-server:latest
    container_name: eureka-server
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "8761:8761"
    networks:
      - ecommerce-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  # ── User Service ───────────────────────────────────────────────────────────
  user-service:
    image: ecommerce/user-service:latest
    container_name: user-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123
      SERVER_PORT: 8081
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ── Product Service ────────────────────────────────────────────────────────
  product-service:
    image: ecommerce/product-service:latest
    container_name: product-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123
      SERVER_PORT: 8082
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 400s

  # ── Payment Service ────────────────────────────────────────────────────────
  payment-service:
    image: ecommerce/payment-service:latest
    container_name: payment-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123
      SERVER_PORT: 8085
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ── Order Service ──────────────────────────────────────────────────────────
  order-service:
    image: ecommerce/order-service:latest
    container_name: order-service
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123
      SERVER_PORT: 8083
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  order-service-1:
    image: ecommerce/order-service:latest
    container_name: order-service-1
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123
      SERVER_PORT: 8084
      JAVA_OPTS: "-Xms256m -Xmx512m"
    networks:
      - ecommerce-net
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]   # fixed: was 8083
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    image: ecommerce/api-gateway:latest
    container_name: api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    networks:
      - ecommerce-net
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql-data:

networks:
  ecommerce-net:
    driver: bridge
