<div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-box-seam"></i> Manage Products</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" ng-click="newProduct()">
            <i class="bi bi-plus-circle"></i> Add Product
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th><th>Name</th><th>Category</th>
                        <th class="text-end">Price</th><th class="text-center">Stock</th><th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="p in products">
                        <td class="text-muted small">{{p.id}}</td>
                        <td><strong>{{p.name}}</strong><br><small class="text-muted">{{p.description | limitTo:60}}...</small></td>
                        <td><span class="badge bg-secondary">{{p.category}}</span></td>
                        <td class="text-end">${{p.price | number:2}}</td>
                        <td class="text-center">
                            <span class="badge" ng-class="p.stock > 0 ? 'bg-success' : 'bg-danger'">{{p.stock}}</span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    data-bs-toggle="modal" data-bs-target="#productModal"
                                    ng-click="editProduct(p)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" ng-click="deleteProduct(p.id)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr ng-show="products.length === 0">
                        <td colspan="6" class="text-center text-muted py-4">No products found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">{{editMode ? 'Edit Product' : 'Add New Product'}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Name</label>
                    <input type="text" class="form-control" ng-model="productForm.name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" rows="2" ng-model="productForm.description"></textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Price ($)</label>
                        <input type="number" class="form-control" ng-model="productForm.price" min="0" step="0.01">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Stock</label>
                        <input type="number" class="form-control" ng-model="productForm.stock" min="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <input type="text" class="form-control" ng-model="productForm.category" placeholder="e.g. Electronics">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Image URL</label>
                    <input type="text" class="form-control" ng-model="productForm.imageUrl" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary"
                        data-bs-dismiss="modal"
                        ng-click="saveProduct()"
                        ng-disabled="!productForm.name || !productForm.price">
                    <i class="bi bi-check-lg"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>
