<div>
    <h2 class="fw-bold mb-4"><i class="bi bi-person-lines-fill"></i> Customer Management</h2>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th><th>Username</th><th>Name</th>
                        <th>Mobile</th><th class="text-center">Status</th><th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="c in customers">
                        <td class="text-muted small">{{c.id}}</td>
                        <td><strong>{{c.username}}</strong></td>
                        <td>{{c.firstName}} {{c.lastName}}</td>
                        <td>{{c.mobileNumber}}</td>
                        <td class="text-center">
                            <span class="badge" ng-class="c.accountEnabled ? 'bg-success' : 'bg-secondary'">
                                {{c.accountEnabled ? 'Active' : 'Disabled'}}
                            </span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-warning me-1"
                                    ng-show="c.accountEnabled"
                                    ng-click="disableCustomer(c.id)">
                                <i class="bi bi-person-dash"></i> Disable
                            </button>
                            <button class="btn btn-sm btn-outline-success me-1"
                                    ng-show="!c.accountEnabled"
                                    ng-click="enableCustomer(c.id)">
                                <i class="bi bi-person-check"></i> Enable
                            </button>
                            <button class="btn btn-sm btn-outline-danger"
                                    ng-click="deleteCustomer(c.id)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr ng-show="customers.length === 0">
                        <td colspan="6" class="text-center text-muted py-4">No customers found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
