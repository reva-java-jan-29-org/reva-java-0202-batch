<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Sign In</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-danger" ng-show="error">
                    <i class="bi bi-exclamation-triangle"></i> {{error}}
                </div>

                <form name="loginForm" ng-submit="login()" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control"
                                   ng-model="loginData.username"
                                   placeholder="Enter your username"
                                   required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control"
                                   ng-model="loginData.password"
                                   placeholder="Enter password"
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2"
                            ng-disabled="loading || loginForm.$invalid">
                        <span ng-show="!loading"><i class="bi bi-box-arrow-in-right"></i> Login</span>
                        <span ng-show="loading">
                            <span class="spinner-border spinner-border-sm me-1"></span> Signing in...
                        </span>
                    </button>
                </form>

                <hr>
                <p class="text-center mb-0">
                    Don't have an account?
                    <a href="#!/register" class="text-primary fw-semibold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
