spring.application.name=week5-01-jpa-entity-relationships-03012026

# ============================================================
# DATASOURCE CONFIGURATION (MySQL - used for main application)
# Tests use H2 in-memory DB automatically via @DataJpaTest
# ============================================================
spring.datasource.url=jdbc:mysql://localhost/empmgmtdb
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Root123

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================

# DDL Strategy:
#   none     - do nothing (production)
#   validate - validate schema, do not change (pre-production)
#   update   - update schema if changes detected (development)
#   create   - drop + create on each startup
#   create-drop - create on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in console (very useful for learning!)
spring.jpa.show-sql=true

# Format the SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Highlight SQL keywords in the console output
spring.jpa.properties.hibernate.highlight_sql=true
