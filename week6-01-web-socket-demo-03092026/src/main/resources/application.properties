spring.application.name=week6-01-web-socket-demo-03092026

# Server
server.port=8080

# WebSocket heartbeat (milliseconds)
# Sent from server -> client and expected client -> server
websocket.stomp.heartbeat.send=10000
websocket.stomp.heartbeat.receive=10000

# Logging — show WebSocket/STOMP traffic at DEBUG level
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
