<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .highlight-yellow {
        background-color: yellow;
    }

</style>

<body>

    <div ng-class="{highlight-yellow: flag==true}" style="border:2px solid red; width:300px; height:300px; padding:20px; margin:10px; display: inline-block; " ng-controller="MainCtrl">

        <h1> {{ name }} </h1>
        <button ng-click="onMouseHover()">Yellow</button>

        <p>This is my <span imp>Paragraph</span> </p>

       

    </div>

    <div style="border:2px solid blue; width:300px; height:300px; padding:10px; margin:20px; display: inline-block;">

        <h1> {{ name }} </h1>

    </div>
    

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <script>


        angular.module('myApp', [])
            .controller('MainCtrl', function($scope) {
                $scope.name = 'AngularJS';
                $scope.flag = false;
                $scope.onMouseHover = function(){
                    alert("yellow")
                    $scope.flag = true;
                }
            })
            
        )

    </script>

</body>
</html>
