# ─────────────────────────────────────────────────────────────────────────────
# Application Info
# ─────────────────────────────────────────────────────────────────────────────
spring.application.name=spring-web-rest-api-demo

# ─────────────────────────────────────────────────────────────────────────────
# Server Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Embedded Tomcat listens on port 8080 by default.
# You can change it here if 8080 is already in use.
server.port=8080

# ─────────────────────────────────────────────────────────────────────────────
# MySQL DataSource
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────────────────
# update — Hibernate checks your entities and updates the DB schema automatically.
# Other options: none | validate | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console (useful during development)
spring.jpa.show-sql=true

# Format the SQL output so it's easier to read
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect — tells Hibernate which SQL flavour to generate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────────────────────────────────────
# Jackson (JSON serialization)
# ─────────────────────────────────────────────────────────────────────────────
# Don't include null fields in JSON responses
spring.jackson.default-property-inclusion=non_null

# Pretty-print JSON responses (turn off in production for bandwidth savings)
spring.jackson.serialization.indent-output=true

spring.security.user.name=vishal
spring.security.user.password=vishal123


